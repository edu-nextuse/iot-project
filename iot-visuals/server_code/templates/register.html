<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FysioFit – Registreren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 1.2rem; }
        .navbar-brand { font-size: 1.4rem; }
        .form-control { font-size: 1.2rem; padding: 12px 16px; }
        .form-label   { font-size: 1.1rem; font-weight: 600; }
        .btn-lg-custom { font-size: 1.3rem; padding: 14px; font-weight: 700; width: 100%; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">FysioFit Buddy</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-1">Account aanmaken</h4>
                    <p class="text-muted mb-4">Vul je gegevens in om te beginnen.</p>

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="/register">
                        <div class="mb-4">
                            <label class="form-label">Naam</label>
                            <input type="text" name="name" class="form-control" placeholder="Jan de Vries" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">E-mailadres</label>
                            <input type="email" name="email" class="form-control" placeholder="naam@voorbeeld.nl" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Wachtwoord</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimaal 6 tekens" required>
                        </div>
                        <button type="submit" class="btn btn-dark btn-lg-custom">Account aanmaken</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        Al een account? <a href="/login" class="text-dark fw-bold">Inloggen</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
