<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FysioFit - Calibreren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FysioFit Buddy</a>
        <a href="/" class="btn btn-outline-light btn-sm">← Terug naar portaal</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-2">Systeem calibreren</h5>

                    <p id="cal-instruction" class="text-muted small mb-3">
                        Houd je armen omhoog en loop langzaam naar achteren totdat je polsen in beeld zijn.
                    </p>

                    <div class="rounded p-3 mb-3 bg-light d-flex align-items-center gap-2">
                        <span id="cal-state-label" class="fw-bold text-secondary small">Polsen niet in beeld</span>
                    </div>

                    <div id="cal-bar-wrap" class="mb-3" style="opacity: 0.3;">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Stilhouden...</span>
                            <span id="cal-pct">0%</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div id="cal-bar" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 0%;"></div>
                        </div>
                    </div>

                    <button id="cal-btn" onclick="this.classList.remove('btn-outline-warning'); this.classList.add('btn-warning', 'text-dark'); this.style.backgroundColor='#ffdb66'; this.style.borderColor='#ffdb66'; this.innerText='Calibreren...'; startCalibration();" class="btn btn-outline-warning w-100 fw-bold">
                        Start calibratie
                    </button>


                    <div id="cal-success" class="alert alert-success mt-3 d-none mb-0">
                        Calibratie geslaagd! Je wordt doorgestuurd...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let calPollInterval = null;

    async function startCalibration() {

        await fetch('/start_calibration', { method: 'POST' }); // Zorg dat server in calibratie modus komt

        const btn = document.getElementById('cal-btn');
        const label = document.getElementById('cal-state-label');
        const barWrap = document.getElementById('cal-bar-wrap');
        const bar = document.getElementById('cal-bar');
        const pct = document.getElementById('cal-pct');
        const success = document.getElementById('cal-success');
        const instruction = document.getElementById('cal-instruction');

        btn.disabled = true;
        success.classList.add('d-none');
        bar.style.width = '0%';
        bar.classList.add('bg-warning', 'progress-bar-animated');
        bar.classList.remove('bg-success');
        pct.textContent = '0%';

        if (calPollInterval) clearInterval(calPollInterval);

        calPollInterval = setInterval(async () => {
            try {
                const res = await fetch('/calibration_status');
                const data = await res.json();

                if (data.status === 'calibrated') {
                    clearInterval(calPollInterval);
                    bar.style.width = '100%';
                    bar.classList.remove('bg-warning', 'progress-bar-animated');
                    bar.classList.add('bg-success');
                    barWrap.style.opacity = '1';
                    pct.textContent = '100%';
                    label.className = 'fw-bold text-success small';
                    label.textContent = 'Calibratie voltooid';
                    success.classList.remove('d-none');

                    setTimeout(() => {
                        window.location.href = '/buddy';
                    }, 1500);

                } else if (data.status === 'calibrating') {
                    const p = Math.round(data.progress || 0);
                    bar.style.width = p + '%';
                    pct.textContent = p + '%';
                    barWrap.style.opacity = '1';
                    label.className = 'fw-bold text-warning small';
                    label.textContent = 'Polsen in beeld — houd stil';
                    instruction.textContent = 'Goed zo! Houd je positie vast totdat de balk vol is.';

                } else if (data.status === 'out_of_frame') {
                    bar.style.width = '0%';
                    pct.textContent = '0%';
                    barWrap.style.opacity = '0.3';
                    label.className = 'fw-bold text-secondary small';
                    label.textContent = 'Polsen niet in beeld';
                    instruction.textContent = 'Houd je armen omhoog en loop langzaam naar achteren totdat je polsen in beeld zijn.';
                    btn.disabled = false;
                }

            } catch (err) {
                clearInterval(calPollInterval);
                label.className = 'fw-bold text-danger small';
                label.textContent = 'Verbindingsfout';
                btn.disabled = false;
            }
        }, 500);
    }

    // Als al gecalibreerd, direct doorsturen
    async function checkInitialState() {
        try {
            const res = await fetch('/calibration_status');
            const data = await res.json();
            if (data.status === 'calibrated') {
                window.location.href = '/buddy';
            }
        } catch (e) {}
    }

    checkInitialState();
</script>

</body>
</html>
